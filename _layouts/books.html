---
layout: null
---

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Books & Reviews · {{ site.title }}</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 2rem 1rem; }
    .container { max-width: 850px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 2rem; }
    .item { margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem; }
    .item h2 { margin: 0 0 0.5rem; }
    .item h2 a { color: #0284c7; text-decoration: none; }
    .item h2 a:hover { color: #0369a1; }
    .review { color: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Books Read & Reviews</h1>
    {% for book in site.books %}
      <div class="item">
        <h2><a href="{{ book.url | relative_url }}">{{ book.title }}</a></h2>
        {% if book.review %}
          <p class="review">{{ book.review }}</p>
        {% endif %}
      </div>
    {% endfor %}
  </div>
</body>
</html>

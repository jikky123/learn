---
layout: null
---

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <style>
    :root {
      --bg: #f8fafc;
      --text: #1e293b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 3rem 1rem;
      text-align: center;
    }

    header h1 {
      margin: 0 0 1rem;
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--text);
    }

    .about {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      color: #334155;
    }

    .contact {
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover {
      color: var(--accent-hover);
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    nav a {
      display: inline-block;
      padding: 0.8rem 1.4rem;
      background: var(--accent);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease-in-out;
    }

    nav a:hover {
      background: var(--accent-hover);
    }

    footer {
      margin-top: 3rem;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 1. Site Name -->
    <header>
      <h1>{{ site.title }}</h1>
    </header>

    <!-- 2. About Me -->
    <section class="about">
      {{ site.about | default: site.description }}
    </section>

    <!-- 3. Contact Email -->
    {% if site.email %}
      <div class="contact">
        📧 <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      </div>
    {% endif %}

    <!-- 4. Section Links -->
    <nav>
      <a href="{{ '/blog/' | relative_url }}">Blog Posts</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/books/' | relative_url }}">Book Reviews</a>
    </nav>


    <footer>
      &copy; {{ site.title }} {{ site.time | date: "%Y" }}
    </footer>
  </div>
</body>
</html>
